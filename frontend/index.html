<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLR Pincode Explorer - API Test</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #22d3ee;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-dim);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid #334155;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        input {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 0.5rem;
            flex-grow: 1;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button.secondary {
            background: #334155;
        }

        button.secondary:hover {
            background: #475569;
        }

        #result-container {
            background: #000;
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid #334155;
            position: relative;
            min-height: 200px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.5rem;
        }

        pre {
            margin: 0;
            overflow-x: auto;
            color: #10b981;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-weight: bold;
        }

        .status-ok { background: #065f46; color: #34d399; }
        .status-error { background: #7f1d1d; color: #f87171; }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>BLR Pincode API Demo</h1>
            <p>Test your FastAPI backend endpoints in real-time</p>
        </header>

        <div class="grid">
            <!-- Test 1: All Areas -->
            <div class="card">
                <h3>All Areas</h3>
                <p>Fetch all 25 pincode records.</p>
                <button onclick="testApi('/api/areas')">Fetch All</button>
            </div>

            <!-- Test 2: Pincode Lookup -->
            <div class="card">
                <h3>Lookup by Pincode</h3>
                <div class="input-group">
                    <input type="text" id="pincodeInput" placeholder="e.g. 560034">
                    <button onclick="testLookup('pincode')">Search</button>
                </div>
            </div>

            <!-- Test 3: Area Lookup -->
            <div class="card">
                <h3>Lookup by Area Name</h3>
                <div class="input-group">
                    <input type="text" id="areaInput" placeholder="e.g. Koramangala">
                    <button onclick="testLookup('area')">Search</button>
                </div>
            </div>

            <!-- Test 4: Corporations -->
            <div class="card">
                <h3>Corporations</h3>
                <p>Get unique corporation list.</p>
                <div class="input-group">
                    <button onclick="testApi('/api/corporations')">Get List</button>
                </div>
            </div>
        </div>

        <div id="result-container">
            <div class="result-header">
                <span id="endpoint-name">Response Output</span>
                <span id="status-badge" class="status-badge" style="display:none"></span>
            </div>
            <div id="loading" class="loading">Loading...</div>
            <pre id="json-output">// Click a button to test an endpoint</pre>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8000';

        async function testApi(endpoint) {
            const output = document.getElementById('json-output');
            const statusBadge = document.getElementById('status-badge');
            const loading = document.getElementById('loading');
            const endpointName = document.getElementById('endpoint-name');

            endpointName.innerText = `GET ${endpoint}`;
            output.innerText = '';
            loading.style.display = 'block';
            statusBadge.style.display = 'none';

            try {
                const response = await fetch(`${BASE_URL}${endpoint}`);
                const data = await response.json();
                
                statusBadge.innerText = `${response.status} ${response.statusText}`;
                statusBadge.className = `status-badge ${response.ok ? 'status-ok' : 'status-error'}`;
                statusBadge.style.display = 'inline-block';
                
                output.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                statusBadge.innerText = 'Connection Failed';
                statusBadge.className = 'status-badge status-error';
                statusBadge.style.display = 'inline-block';
                output.innerText = `Error: ${error.message}\n\nMake sure your backend is running on ${BASE_URL}`;
            } finally {
                loading.style.display = 'none';
            }
        }

        function testLookup(type) {
            const value = document.getElementById(type + 'Input').value;
            if (!value) {
                alert('Please enter a value');
                return;
            }
            testApi(`/api/lookup?${type}=${encodeURIComponent(value)}`);
        }
    </script>
</body>
</html>
